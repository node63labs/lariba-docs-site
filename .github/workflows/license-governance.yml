name: License Governance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-governance:
    name: License Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify tracked third-party license inventory
        run: npm run licenses:check
