name: NODE63 Release Gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact governed source commit SHA
        required: true
        type: string
      record_path:
        description: ST-01 release record path under evidence/releases/
        required: true
        type: string
      release_authority_ref:
        description: Durable release authority locator already present in authorization.evidence
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  release_evidence:
    name: CI-C08 Release Evidence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout explicit governed source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify explicit source binding
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          ACTUAL="$(git rev-parse HEAD)"

          test "$ACTUAL" = "$SOURCE_SHA"

          case "$SOURCE_SHA" in
            *[!0-9a-f]*|"")
              exit 1
              ;;
          esac

          test "${#SOURCE_SHA}" = "40"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate canonical W3 release record
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RECORD_PATH: ${{ inputs.record_path }}
        run: |
          set -euo pipefail

          python scripts/release/node63_release.py validate \
            --record "$RECORD_PATH" \
            --repository "node63labs/lariba-docs-site" \
            --release-class "RC-03" \
            --source-sha "$SOURCE_SHA"

  material_release_gate:
    name: CI-C09 Material Release Gate
    needs:
      - release_evidence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout explicit governed source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify explicit source binding
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Enforce pre-release W3 gate
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RECORD_PATH: ${{ inputs.record_path }}
          RELEASE_AUTHORITY_REF: ${{ inputs.release_authority_ref }}
        run: |
          set -euo pipefail

          python scripts/release/node63_release.py gate \
            --record "$RECORD_PATH" \
            --repository "node63labs/lariba-docs-site" \
            --release-class "RC-03" \
            --source-sha "$SOURCE_SHA" \
            --release-authority-ref "$RELEASE_AUTHORITY_REF"

      - name: Confirm mutation boundary
        shell: bash
        run: |
          set -euo pipefail

          echo "PACKAGE_PUBLISH=NO"
          echo "TAG_CREATION=NO"
          echo "PROVIDER_DEPLOYMENT=NO"
          echo "REPOSITORY_PUSH=NO"
          echo "DATABASE_MUTATION=NO"
          echo "MATERIAL_RELEASE_EXECUTION=NO"
